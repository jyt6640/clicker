<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#050505">
<meta name="robots" content="noindex">
<title>&nbsp;</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/base.css?v=24">
<link rel="stylesheet" href="./lock.css?v=24">
</head>
<body>

<div id="status" class="status pulse">연결 중</div>

<main id="stage" class="stage" hidden>
  <div id="count" class="count tabular">0</div>

  <div id="shackle" class="shackle"></div>
  <div id="dials" class="dials" role="group" aria-label="자물쇠 다이얼"></div>

  <button id="try" class="try" type="button">열기</button>

  <div id="hint" class="hint mono">? ? ?</div>
</main>

<section id="done" class="done" hidden>
  <h1 id="done-title"></h1>
  <p id="done-msg" class="msg"></p>
  <a id="survey" class="survey" href="#" target="_blank" rel="noopener noreferrer">설문 남기기</a>
  <p id="survey-pending" class="survey-pending" hidden>설문 준비 중</p>
</section>

<section id="setup" class="setup" hidden>
  <h2>설정이 필요합니다</h2>
  <p><code>config.js</code>의 <code>supabaseConfig</code>를 채워주세요.</p>
</section>

<script type="module" src="./lock.js?v=24"></script>
</body>
</html>
