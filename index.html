<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#050505">
<meta name="robots" content="noindex">
<title>&nbsp;</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<!-- 애셋 뒤의 ?v= 는 캐시 무효화용입니다. 배포할 때마다 전체를 함께 올려주세요. -->
<link rel="stylesheet" href="./shared/base.css?v=5">
<link rel="stylesheet" href="./style.css?v=5">
</head>
<body>

<div id="status" class="status pulse">연결 중</div>

<main id="stage" class="stage" hidden>
  <div id="count" class="count tabular">0</div>

  <div id="cylinder" class="cylinder" role="button" tabindex="0" aria-label="클릭하기">
    <span class="cyl-top"></span>
    <span class="cyl-body">
      <span class="crack crack-1"></span>
      <span class="crack crack-2"></span>
      <span class="crack crack-3"></span>
      <span class="crack crack-4"></span>
    </span>
    <span class="cyl-bottom"></span>
  </div>

  <div id="sub" class="sub tabular">0 / 20,000</div>
</main>

<section id="done" class="done" hidden>
  <h1 id="done-title"></h1>
  <p id="done-msg" class="msg"></p>
  <a id="survey" class="survey" href="#" target="_blank" rel="noopener noreferrer">설문 남기기</a>
  <p id="survey-pending" class="survey-pending" hidden>설문 준비 중</p>
</section>

<section id="setup" class="setup" hidden>
  <h2>설정이 필요합니다</h2>
  <p><code>config.js</code>의 <code>firebaseConfig</code>를 채워주세요.<br>자세한 절차는 저장소의 <code>README.md</code>에 있습니다.</p>
</section>

<script type="module" src="./app.js?v=5"></script>
</body>
</html>
